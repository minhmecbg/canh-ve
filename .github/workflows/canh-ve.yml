name: Canh vé rẻ

on:
  schedule:
    - cron: "*/30 * * * *"   # mỗi 30 phút: đọc lệnh Telegram, tra giá chuyến đến hạn
  workflow_dispatch:

concurrency:
  group: canh-ve
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tra giá và gửi thông báo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DROP_PERCENT: ${{ vars.DROP_PERCENT }}
          MONTHLY_LIMIT: ${{ vars.MONTHLY_LIMIT }}
        run: node watch.js
      - name: Lưu lịch sử giá
        run: |
          git config user.name "canh-ve-bot"
          git config user.email "canh-ve-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "Cập nhật giá" && git push)
